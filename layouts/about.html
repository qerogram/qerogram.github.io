{{ define "main" }}
<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
    <title>{{ .Title }} | {{ site.Title }}</title>
    <style>
        /* 여기서 완전 커스텀 CSS 작성 가능 */
        body { max-width: 100%; margin: 0; padding: 0; }
        body, .main { 
            max-width: 100%; 
            margin-left: auto; 
            margin-right: auto; 
            text-align: left; /* 가운데 정렬 강제 해제 */
        }
    </style>
</head>
<body>
    <!-- 완전 독립된 내용 시작 -->
    <div class="custom-about">
        {{ .Content }}
    </div>
    <!-- 필요하면 footer partial 등 추가 -->
</body>
</html>
{{ end }}
