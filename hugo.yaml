baseURL: "https://qerogram.github.io/"
title: "Qerogram의 IT 삽질기 | Qerogram's IT Journal"
locale: "ko-kr"
theme: ["PaperMod"]

sitemap:
  changeFreq: monthly
  priority: 0.5
  
params:
  description: "White Hat Hacker의 시각으로 바라본 Cloud, Development, Security 등 IT의 각분야 | Exploring various IT domains through a white-hat hacker's perspective"
  mainSections: ["posts"]
  style:
    main: "max-w-7xl"
  
  author: ["Qerogram"]

  enableRobotsTXT: true
  # 홈페이지 설정
  home:
    layout: "background"
    homepageImage: "/img/background.jpg"
    title: "Qerogram의 IT 삽질기"
    subtitle: "White Hat Hacker's Perspective | Cloud, Security, Infrastructure"
    showRecent: true
    showRecentItems: 6
    showMoreLink: true
    showMoreLinkDest: "/posts/"
    layoutBackgroundBlur: true

  # Article (글 본문) 설정
  article:
    toc: true
    tocOpen: true
    tocSide: left
    tocTitle: "Agenda"
    showDate: true
    showAuthor: true
    showReadingTime: false
    showWordCount: false
    showTags: true

  # Series 설정
  series:
    display: true

  defaultTheme: dark
  colorScheme: "slate"

  # 전역 설정
  ShowReadingTime: false
  ShowShareButtons: true

# Taxonomies
taxonomies:
  series: "series"
  tag: "tags"
  category: "categories"
  
markup:
  highlight:
    style: dracula
    lineNos: true
  goldmark:
    renderer:
      unsafe: true

titleCaseStyle: none
# 메뉴
menu:
  main:
    - name: About
      url: /about
      weight: 10
    - name: Posts
      url: /posts
      weight: 20

